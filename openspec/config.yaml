schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Учебные лабораторные по защите информации. Главный источник заданий:
  lectures/Лабораторные работы ЗИ.pdf; теорию брать из lectures/.
  Проверять формулы визуально: pdftotext искажает степени.
  C++20, только стандартная библиотека, простой понятный код.
  Сборка одной командой g++, без CMake, Make и пакетных менеджеров.
  Общая библиотека: common/crypto.hpp и common/crypto.cpp.
  Макет лабораторной: labs/labNN/main.cpp, README.md, при необходимости tests.cpp.
  Бинарники в build/. Все подробные Markdown-отчёты в local/reports/;
  вся local/ игнорируется Git и никогда не добавляется принудительно.
  Читать AGENTS.md и openspec/progress.md перед продолжением работы.
  Числа в задании порядка 10^9. Текущий контракт: модуль и абсолютные
  значения не выше 2 000 000 000; произведения в long long без __int128.
  Тест Ферма — вероятностный, не обещать доказанную простоту и не подменять алгоритм.
  Дискретный логарифм: BSGS по формуле x=im-j, минимальный x>=0 либо nullopt.
  Контракт BSGS: 2<=p<=2000000000, 1<=a<p, 0<=y<p, gcd(a,p)=1.
  Нарушение взаимной простоты — ошибка условий, а не отсутствие решения.
  Диффи — Хеллман: простое p>=5, первообразный 2<=g<=p-2, секреты 2..p-1.
  Генерация DH использует простые p=2q+1 и q; ручной p может быть другим простым.
  Точная is_prime и проверка is_primitive_root добавлены отдельно от теста Ферма.
  Оригиналы PDF сохранять. course_files/ содержит вспомогательные примеры курса.
  Следующая лабораторная добавляет функции в общую библиотеку, сохраняя прежние проверки.

rules:
  proposal:
    - Указать номер лабораторной и точную страницу PDF задания.
  specs:
    - Задать числовые границы, граничные случаи и наблюдаемый результат.
  design:
    - Объяснить алгоритм и безопасность промежуточных вычислений простым языком.
  tasks:
    - Включить реализацию, проверки, отчёт в local/reports/ и обновление прогресса.
